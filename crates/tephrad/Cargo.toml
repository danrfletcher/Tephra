[package]
name = "tephrad"
version = "0.1.0"
edition = "2021"
description = "Federated graph and link engine daemon"

[[bin]]
name = "tephrad"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
rand = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tephra-cache = { path = "../tephra-cache" }

[dev-dependencies]
tempfile = "3"
rusqlite = { version = "0.31", features = ["bundled"] }
