[package]
name = "tephrad"
version = "0.1.0"
edition = "2021"
description = "Federated graph and link engine daemon"

[lib]
name = "tephrad"
path = "src/lib.rs"

[[bin]]
name = "tephrad"
path = "src/main.rs"

[[bin]]
name = "register_sources"
path = "src/bin/register_sources.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
rand = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tephra-cache = { path = "../tephra-cache" }
tephra-parser = { path = "../tephra-parser" }
notify = "6"
walkdir = "2"
rusqlite = { version = "0.31", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
