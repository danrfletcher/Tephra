[package]
name = "tephrad"
version = "0.1.0"
edition = "2021"
description = "Federated graph and link engine daemon"

[lib]
name = "tephrad"
path = "src/lib.rs"

[[bin]]
name = "tephrad"
path = "src/main.rs"

[[bin]]
name = "register_sources"
path = "src/bin/register_sources.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
rand = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tephra-cache = { path = "../tephra-cache" }
tephra-parser = { path = "../tephra-parser" }
tephra-graph = { path = "../tephra-graph" }
notify = "6"
walkdir = "2"
rusqlite = { version = "0.31", features = ["bundled"] }
axum = { version = "0.8.9", features = ["ws"] }
tower = { version = "0.5.3", features = ["util"] }
serde_json = "1.0.154"
subtle = "2.6.1"
libc = "0.2"

[dev-dependencies]
reqwest = { version = "0.13.5", features = ["json"] }
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
tokio-tungstenite = "0.30.0"
futures-util = "0.3.34"
filetime = "0.2.29"
