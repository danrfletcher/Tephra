[package]
name = "tephractl"
version = "0.1.0"
edition = "2021"
description = "Command-line client for the tephrad daemon"

[lib]
name = "tephractl"
path = "src/lib.rs"

[[bin]]
name = "tephractl"
path = "src/main.rs"

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros"] }
axum = { version = "0.8.9", features = ["ws"] }
tephrad = { path = "../tephrad" }
tephra-cache = { path = "../tephra-cache" }
tephra-graph = { path = "../tephra-graph" }
