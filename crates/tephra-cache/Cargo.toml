[package]
name = "tephra-cache"
version = "0.1.0"
edition = "2021"
description = "SQLite persistent cache: schema, versioning, and source-status bookkeeping for tephrad"

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"
# The scan lives in tephrad, which depends on this crate: integration
# tests (not the lib) may use it to build a cache the way the daemon does.
tephrad = { path = "../tephrad" }
