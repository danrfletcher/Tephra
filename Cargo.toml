[workspace]
resolver = "2"
members = [
    "crates/tephrad",
    "crates/tephra-cache",
    "crates/tephra-parser",
    "crates/tephra-remote",
    "crates/tephra-graph",
    "crates/tephractl",
]

# Debug builds hash and parse large inputs in tests (15 MB files, 2 MB
# single-line sources). Unoptimised SHA-256 and tree-sitter C code make
# those tests CPU-hungry enough to starve the timing-sensitive tests that
# run beside them, so these dependencies are built optimised even in dev.
# The prose parser (tephra-parser and its pulldown-cmark) is optimised too:
# its multi-megabyte budget tests (tests/unit/large_file.rs) and every scan
# that parses a file run it hot, and unoptimised it took 9-13 s on a 10 MB
# file, so a loaded host failed those budgets and starved the timing tests
# beside them. SQLite (libsqlite3-sys, the bundled C amalgamation) is
# optimised for the same reason: the tephra-cache budget tests
# (tests/fts_query.rs: 500 ms queries over 100,000 rows) run almost
# entirely inside it. Optimising changes only speed, not behaviour. The
# other workspace crates keep debug info and overflow checks.

[profile.dev.package.tephra-parser]
opt-level = 3

[profile.dev.package.pulldown-cmark]
opt-level = 3
[profile.dev.package.libsqlite3-sys]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.tree-sitter]
opt-level = 3

[profile.dev.package.tree-sitter-bash]
opt-level = 3

[profile.dev.package.tree-sitter-c]
opt-level = 3

[profile.dev.package.tree-sitter-cpp]
opt-level = 3

[profile.dev.package.tree-sitter-go]
opt-level = 3

[profile.dev.package.tree-sitter-java]
opt-level = 3

[profile.dev.package.tree-sitter-javascript]
opt-level = 3

[profile.dev.package.tree-sitter-lua]
opt-level = 3

[profile.dev.package.tree-sitter-python]
opt-level = 3

[profile.dev.package.tree-sitter-rust]
opt-level = 3

[profile.dev.package.tree-sitter-swift]
opt-level = 3

[profile.dev.package.tree-sitter-toml-ng]
opt-level = 3

[profile.dev.package.tree-sitter-typescript]
opt-level = 3

[profile.dev.package.tree-sitter-yaml]
opt-level = 3
